name: Verify NoeMixerr rebrand consistency
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-rebrand:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check rebrand script for pending edits
        run: |
          python3 tools/rebrand_noemixerr.py
          git diff --exit-code -- . ':(exclude).github/workflows/**'
