name: Linux build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config qtbase5-dev qttools5-dev qttools5-dev-tools libqt5svg5-dev libsndfile1-dev libfftw3-dev libsamplerate0-dev libasound2-dev libpulse-dev libjack-jackd2-dev libfltk1.3-dev libvorbis-dev libogg-dev libmpg123-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test CLI
        run: |
          if test -x build/bin/noemixerr; then build/bin/noemixerr --help || true; fi
