name: Linux build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config qtbase5-dev qtbase5-private-dev libqt5x11extras5-dev libxcb-util-dev libxcb-keysyms1-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-render-util0-dev libxcb-xkb-dev libx11-xcb-dev qttools5-dev qttools5-dev-tools libqt5svg5-dev libsndfile1-dev libfftw3-dev libsamplerate0-dev libasound2-dev libpulse-dev libjack-jackd2-dev libfltk1.3-dev libvorbis-dev libogg-dev libmpg123-dev liblist-moreutils-perl
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Legacy LMMS project reopen smoke test
        run: python3 tools/test_project_compatibility.py build/noemixerr
      - name: Smoke test CLI
        run: |
          if test -x build/bin/noemixerr; then build/bin/noemixerr --help || true; fi
