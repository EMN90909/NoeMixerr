name: Linux build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noemixerr-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config qtbase5-dev qtbase5-private-dev libqt5x11extras5-dev libxcb-util-dev libxcb-keysyms1-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-render-util0-dev libxcb-xkb-dev libx11-xcb-dev qttools5-dev qttools5-dev-tools libqt5svg5-dev libsndfile1-dev libfftw3-dev libsamplerate0-dev libasound2-dev libpulse-dev libjack-jackd2-dev libfltk1.3-dev libvorbis-dev libogg-dev libmpg123-dev liblist-moreutils-perl libxml-parser-perl
      - name: Parse original LMMS project fixtures
        run: python3 tools/legacy_project_audit.py
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DWANT_SWH=OFF
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Legacy LMMS project reopen smoke test
        run: python3 tools/test_project_compatibility.py build/noemixerr
      - name: Headless legacy-project audio render acceptance
        run: python3 tools/test_audio_render.py build/noemixerr
      - name: Preserve native build output
        uses: actions/upload-artifact@v4
        with:
          name: noemixerr-linux-build
          path: |
            build/noemixerr
            build/noemixerr.exe
            build/plugins/**
            build/lib/**
          if-no-files-found: warn
          retention-days: 7
      - name: Smoke test CLI
        run: |
          test -x build/noemixerr
          build/noemixerr --help
