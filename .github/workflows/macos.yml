name: macOS build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noemixerr-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: brew install cmake ninja qt@5 libsndfile fftw libsamplerate pkg-config
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DWANT_SWH=OFF -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)"
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Verify version metadata and executable
        run: python3 tools/check_version.py build/noemixerr
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Legacy LMMS project reopen smoke test
        run: python3 tools/test_project_compatibility.py build/noemixerr
      - name: Headless legacy-project audio render acceptance
        run: python3 tools/test_audio_render.py build/noemixerr
      - name: Preserve native build output
        uses: actions/upload-artifact@v4
        with:
          name: noemixerr-macos-build
          path: |
            build/noemixerr
            build/noemixerr.exe
            build/plugins/**
            build/lib/**
          if-no-files-found: warn
          retention-days: 7
