name: Repair generated export macros
on:
  push:
    paths:
      - 'tools/repair_export_macros.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fix generated export macro references
        run: python3 tools/repair_export_macros.py
      - name: Commit source corrections
        run: |
          git config user.name "Noethric Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git restore --staged .github/workflows || true
          if ! git diff --cached --quiet; then
            git commit -m "fix: match CMake generated NOEMIXERR_EXPORT macros"
            git push origin HEAD:main
          fi
