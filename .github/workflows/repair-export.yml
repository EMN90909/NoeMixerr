name: Verify generated export macros
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-exports:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure no stale generated export macros remain
        run: |
          python3 tools/repair_export_macros.py
          git diff --exit-code
