name: NoeMixerr C++ CI
on:
  push:
  pull_request:
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DNOEMIXERR_GUI=OFF -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-multimedia-dev
      - name: Configure Qt DAW
        run: cmake -S . -B build -DNOEMIXERR_GUI=ON -DBUILD_TESTING=ON
      - name: Build Qt DAW
        run: cmake --build build --parallel 2
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Verify app built
        run: test -x build/NoeMixerr
